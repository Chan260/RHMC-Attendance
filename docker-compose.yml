
services:
  db:
    image: postgres:16
    container_name: rhmc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rhmc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: rhmc_attendance_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ATTENDANCE_SERVICE_API_KEY: ${ATTENDANCE_SERVICE_API_KEY:?ATTENDANCE_SERVICE_API_KEY is required}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  attendance_service:
    build:
      context: ./attendance_service
    container_name: rhmc_attendance_service
    restart: unless-stopped
    environment:
      ATTENDANCE_SERVICE_API_KEY: ${ATTENDANCE_SERVICE_API_KEY:?ATTENDANCE_SERVICE_API_KEY is required}
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  rhmc_postgres_data:


