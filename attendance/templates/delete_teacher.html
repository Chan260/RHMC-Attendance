{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Delete Enrollment - RHMC AttendEase</title>

    <link
        rel="stylesheet"
        href="{% static 'attendance/css/style.css' %}"
    >

</head>


<body class="delete-enrollment-page">


    <div class="container">

        <div class="card">


            <div class="icon">
                !
            </div>


            <h1>
                Delete Enrollment
            </h1>


            <p>
                Are you sure you want to delete this enrollment?
            </p>


            <p class="enrollment-name">

                {{ enrollment.student.name }}

                -
                
                {{ enrollment.subject.subject_name }}

            </p>


            <p class="warning">
                This will remove the student's enrollment
                from this subject.
            </p>


            <div class="buttons">


                <form method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="delete-button"
                    >
                        Yes, Delete
                    </button>

                </form>


                <a
                    href="{% url 'enrollment_list' %}"
                    class="cancel-button"
                >
                    Cancel
                </a>


            </div>


        </div>

    </div>


</body>

</html>
